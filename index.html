<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#00866a">
<title>Minhas Finanças — Controle Financeiro</title>
<style>
:root{
  --green:#00866a;--green2:#00a37f;--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#6d7884;
  --line:#e3e7eb;--danger:#d94b4b;--income:#00866a;--shadow:0 8px 28px rgba(22,34,44,.08);
}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex}.sidebar{width:235px;background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:fixed;inset:0 auto 0 0}
.brand{font-weight:900;font-size:21px;padding:8px 12px 22px;color:var(--green)}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.nav button{width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:11px;color:#52606d;margin:2px 0;font-weight:700}
.nav button.active,.nav button:hover{background:#eaf7f3;color:var(--green)}
.main{margin-left:235px;width:calc(100% - 235px);padding:28px;max-width:1450px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.title h1{margin:0;font-size:27px}.title p{margin:5px 0 0;color:var(--muted)}
.month{display:flex;align-items:center;gap:10px}.month button,.iconbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px}.month strong{min-width:130px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow)}
.metric span{font-size:13px;color:var(--muted);font-weight:700}.metric b{display:block;font-size:24px;margin-top:8px}.metric.in b{color:var(--income)}.metric.out b{color:var(--danger)}
.content{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;margin-top:16px}.card h2{font-size:17px;margin:0 0 15px}
.bar{height:8px;background:#edf0f2;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.catrow{margin:13px 0}.cathead{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.cathead span:last-child{font-weight:800}
.tx{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.tx:last-child{border-bottom:0}.ico{width:39px;height:39px;border-radius:12px;background:#eef8f5;display:grid;place-items:center;font-size:20px;flex:none}.txmain{flex:1;min-width:0}.txmain b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.txmain small{color:var(--muted)}.amount{font-weight:850}.expense{color:#4b5660}.income{color:var(--green)}
.btn{border:0;background:var(--green);color:white;padding:11px 16px;border-radius:10px;font-weight:800}.btn:hover{background:#00765d}.btn.secondary{background:#edf7f4;color:var(--green)}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:12px;font-weight:800;color:#66727d;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:var(--green)}
.tabs{display:flex;gap:7px;margin-bottom:15px}.tab{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:9px;font-weight:750;color:#66727d}.tab.active{background:#eaf7f3;color:var(--green);border-color:#cbece3}
.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 7px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.right{text-align:right!important}
.empty{text-align:center;color:var(--muted);padding:35px}.actions{display:flex;gap:7px;justify-content:flex-end}.danger{color:var(--danger)}
.modal{position:fixed;inset:0;background:rgba(10,20,25,.48);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.modalbox{background:#fff;border-radius:17px;width:min(620px,100%);padding:22px;box-shadow:0 30px 70px rgba(0,0,0,.2)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0}
.switch{display:flex;gap:10px}.switch button{flex:1;border:1px solid var(--line);background:#fff;padding:12px;border-radius:10px;font-weight:800}.switch button.active{background:#eaf7f3;color:var(--green);border-color:#bfe8dc}
.mobilebar{display:none}
@media(max-width:900px){.sidebar{display:none}.main{margin:0;width:100%;padding:18px 16px 85px}.grid{grid-template-columns:repeat(2,1fr)}.content{grid-template-columns:1fr}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:8;padding:7px;justify-content:space-around}.mobilebar button{border:0;background:none;color:#697680;font-size:11px;font-weight:700}.mobilebar button.active{color:var(--green)}.top{align-items:flex-start}.formgrid{grid-template-columns:1fr}}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.metric b{font-size:20px}.month strong{min-width:95px}.table th:nth-child(3),.table td:nth-child(3){display:none}}
</style>
<link rel="manifest" href="manifest.json"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E💰%3C/text%3E%3C/svg%3E%22%3E</head>
<body>
<div id="syncStatus" style="position:fixed;right:14px;top:10px;z-index:20;font-size:11px;color:#00866a;background:#fff;border:1px solid #e3e7eb;border-radius:99px;padding:5px 9px">● conectado à planilha</div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Minhas Finanças<small>controle compartilhado</small></div>
    <div class="nav">
      <button class="active" data-page="dashboard">▦ &nbsp; Painel</button>
      <button data-page="transactions">☷ &nbsp; Transações</button>
      <button data-page="new">＋ &nbsp; Novo lançamento</button>
      <button data-page="cards">▣ &nbsp; Cartões</button>
      <button data-page="settings">⚙ &nbsp; Ajustes</button>
      <button onclick="carregarDadosDaPlanilha()">☁ &nbsp; Sincronizar</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<nav class="mobilebar">
  <button class="active" data-page="dashboard">⌂<br>Painel</button>
  <button data-page="transactions">☷<br>Transações</button>
  <button data-page="new">＋<br>Novo</button>
  <button data-page="cards">▣<br>Cartões</button>
  <button data-page="settings">⚙<br>Ajustes</button>
</nav>

<div class="modal" id="modal"><div class="modalbox">
  <div class="modalhead"><h2>Novo lançamento</h2><button class="iconbtn" onclick="closeModal()">✕</button></div>
  <div class="switch"><button id="expenseBtn" class="active" onclick="setType('expense')">Gasto</button><button id="incomeBtn" onclick="setType('income')">Recebimento</button></div>
  <form id="txForm" onsubmit="saveTx(event)">
    <div class="formgrid" style="margin-top:15px">
      <div class="field"><label>Valor</label><input id="amount" type="number" step="0.01" min="0.01" placeholder="0,00" required></div>
      <div class="field"><label>Data</label><input id="date" type="date" required></div>
      <div class="field"><label>Descrição</label><input id="desc" placeholder="Ex.: Almoço" required></div>
      <div class="field"><label>Categoria</label><select id="category"></select></div>
      <div class="field"><label>Forma de pagamento</label><select id="payment"><option>Dinheiro/débito</option><option>Cartão de crédito</option><option>PIX</option><option>Transferência</option></select></div>
      <div class="field"><label>Parcelas</label><select id="installments"><option value="1">1x</option><option value="2">2x</option><option value="3">3x</option><option value="4">4x</option><option value="5">5x</option><option value="6">6x</option><option value="10">10x</option><option value="12">12x</option></select></div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn">Salvar lançamento</button></div>
  </form>
</div></div>

<!-- iframe oculto para envio sem bloqueio de CORS -->
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(enviando){ carregarDadosDaPlanilha(); enviando=false; }"></iframe>
<form id="hidden_form" action="https://script.google.com/macros/s/AKfycbwpBk-yXTLNl35kKMhWk6A_HvfEc-qkd5x73Sj7eU9_ulk9OGE-DvtJQKyCZXNWYQKKdQ/exec" method="GET" target="hidden_iframe" style="display:none;">
  <input type="hidden" name="action" id="f_action">
  <input type="hidden" name="id" id="f_id">
  <input type="hidden" name="data" id="f_data">
  <input type="hidden" name="descricao" id="f_descricao">
  <input type="hidden" name="categoria" id="f_categoria">
  <input type="hidden" name="tipo" id="f_tipo">
  <input type="hidden" name="valor" id="f_valor">
  <input type="hidden" name="pagamento" id="f_pagamento">
</form>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwpBk-yXTLNl35kKMhWk6A_HvfEc-qkd5x73Sj7eU9_ulk9OGE-DvtJQKyCZXNWYQKKdQ/exec";
let enviando = false;

let state = {
  cards: [{id:1,name:'Cartão de crédito',icon:'💳',limit:5000,closing:10,due:17}],
  categories: [
    ['🍔','Alimentação'],['📺','Assinaturas'],['📚','Educação'],['🎉','Lazer'],['🛒','Mercado'],
    ['🏠','Moradia'],['🎁','Outros gastos'],['🐾','Pets'],['👕','Roupas'],['💊','Saúde'],['🚗','Transporte'],['💰','Recebimento']
  ],
  tx: []
};

let currentPage='dashboard', currentMonth=new Date('2026-09-07T12:00:00'), currentType='expense';

function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function monthKey(){return currentMonth.toISOString().slice(0,7)}
function monthName(){return currentMonth.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}
function monthNav(){return `<div class="month"><button onclick="changeMonth(-1)">‹</button><strong>${monthName()}</strong><button onclick="changeMonth(1)">›</button></div>`}
function header(title,sub=''){return `<div class="top"><div class="title"><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div>${monthNav()}</div>`}
function setPage(p){currentPage=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
function changeMonth(d){currentMonth.setMonth(currentMonth.getMonth()+d);render()}
function monthTx(){return state.tx.filter(t=>t.date && t.date.slice(0,7)===monthKey())}

function dashboard(){
 const tx=monthTx(), inc=tx.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0), out=tx.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
 const cats=state.categories.map(c=>({icon:c[0],name:c[1],v:tx.filter(t=>t.cat===c[1]&&t.type==='expense').reduce((a,t)=>a+t.amount,0)})).filter(c=>c.v).sort((a,b)=>b.v-a.v);
 const recent=[...tx].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7);
 return header('Painel','Painel sincronizado com a planilha')+
 `<div class="grid">
  <div class="card metric"><span>Saldo do mês</span><b>${money(inc-out)}</b></div>
  <div class="card metric in"><span>Entradas</span><b>${money(inc)}</b></div>
  <div class="card metric out"><span>Saídas</span><b>${money(out)}</b></div>
  <div class="card metric"><span>Lançamentos</span><b>${tx.length}</b></div>
 </div>
 <div class="content">
  <div class="card"><h2>Para onde foi o dinheiro</h2>${cats.length?cats.slice(0,8).map(c=>`<div class="catrow"><div class="cathead"><span>${c.icon} ${c.name}</span><span>${money(c.v)}</span></div><div class="bar"><i style="width:${Math.min(100,c.v/(out||1)*100)}%"></i></div></div>`).join(''):'<div class="empty">Ainda não há gastos neste mês.</div>'}</div>
  <div class="card"><h2>Últimos lançamentos</h2>${recent.length?recent.map(txRow).join(''):'<div class="empty">Nenhum lançamento.</div>'}</div>
 </div>`;
}

function txRow(t){return `<div class="tx"><div class="ico">${t.icon||'💸'}</div><div class="txmain"><b>${esc(t.desc)}</b><small>${esc(t.cat)} · ${fmtDate(t.date)}${t.pay?' · '+esc(t.pay):''}</small></div><div class="amount ${t.type}">${t.type==='expense'?'− ':'+ '}${money(t.amount)}</div></div>`}

function transactions(){
 const tx=[...monthTx()].sort((a,b)=>b.date.localeCompare(a.date));
 return header('Transações','Lançamentos da planilha compartilhada')+
 `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div class="tabs"><button class="tab active" onclick="render()">Todos</button></div><button class="btn" onclick="openModal()">＋ Novo lançamento</button></div>
 ${tx.length?`<table class="table"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Forma</th><th class="right">Valor</th><th></th></tr></thead><tbody>${tx.map(t=>`<tr><td>${fmtDate(t.date)}</td><td>${t.icon||'💸'} ${esc(t.desc)}</td><td>${esc(t.cat)}</td><td>${esc(t.pay||'')}</td><td class="right ${t.type}">${t.type==='expense'?'− ':'+ '}${money(t.amount)}</td><td class="right"><button class="iconbtn" title="Excluir" onclick="delTx('${t.id}')">🗑</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum lançamento neste mês.</div>'}</div>`;
}

function newPage(){return header('Novo lançamento','Adicionar na planilha')+`<div class="card" style="max-width:700px"><h2>Adicionar movimentação</h2><button class="btn" onclick="openModal()">＋ Abrir formulário</button></div>`}

function cardsPage(){
 const cards=state.cards||[];
 const creditTx=state.tx.filter(t=>t.pay==='Cartão de crédito'&&t.type==='expense');
 const total=creditTx.filter(t=>t.date && t.date.slice(0,7)===monthKey()).reduce((a,t)=>a+t.amount,0);
 return header('Cartões','Controle de crédito')+
 `<div class="grid">
 ${cards.map(c=>`<div class="card">
    <div><span style="color:var(--muted);font-size:13px;font-weight:700">Cartão</span><h2 style="margin:8px 0">${c.icon} ${c.name}</h2></div>
    <div style="font-size:12px;color:var(--muted)">Fatura de ${monthName()}</div>
    <div style="font-size:26px;font-weight:900;margin:5px 0 12px">${money(total)}</div>
   </div>`).join('')}
 </div>`;
}

function settings(){
 return header('Ajustes','Configuração da Planilha Compartilhada')+
 `<div class="content">
  <div class="card"><h2>Status da Conexão</h2>
   <p style="color:var(--muted)">O aplicativo está conectado diretamente à sua Planilha do Google. Você e sua esposa podem usar ao mesmo tempo.</p>
   <button class="btn" onclick="carregarDadosDaPlanilha()">Sincronizar Agora</button>
  </div>
 </div>`;
}

function render(){document.getElementById('main').innerHTML=currentPage==='dashboard'?dashboard():currentPage==='transactions'?transactions():currentPage==='new'?newPage():currentPage==='cards'?cardsPage():settings();populateCategory()}
function populateCategory(){const s=document.getElementById('category');if(!s)return;s.innerHTML=state.categories.map(c=>`<option value="${esc(c[1])}">${c[0]} ${esc(c[1])}</option>`).join('')}
function openModal(){document.getElementById('modal').classList.add('open');document.getElementById('date').value=new Date().toISOString().slice(0,10);populateCategory()}
function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('txForm').reset()}
function setType(t){currentType=t;document.getElementById('expenseBtn').classList.toggle('active',t==='expense');document.getElementById('incomeBtn').classList.toggle('active',t==='income')}

async function saveTx(e){
 e.preventDefault();
 const cat=document.getElementById('category').value;
 const icon=(state.categories.find(c=>c[1]===cat)||['💸'])[0];
 const amount=Number(document.getElementById('amount').value);
 const n=Number(document.getElementById('installments').value);
 const baseDate=document.getElementById('date').value;
 const desc=document.getElementById('desc').value;
 const pay=document.getElementById('payment').value;

 closeModal();
 document.getElementById('syncStatus').textContent='● salvando...';

 for(let i=0;i<n;i++){
   let d=new Date(baseDate+'T12:00:00');
   d.setMonth(d.getMonth()+i);
   let idTx = 'tx_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
   let novoTx = {
     id: idTx,
     date: d.toISOString().slice(0,10),
     desc: desc + (n>1?` (${i+1}/${n})`:''),
     cat: cat,
     icon: icon,
     amount: amount/n,
     type: currentType,
     pay: pay
   };
   
   state.tx.push(novoTx);

   document.getElementById('f_action').value = 'add';
   document.getElementById('f_id').value = novoTx.id;
   document.getElementById('f_data').value = novoTx.date;
   document.getElementById('f_descricao').value = novoTx.desc;
   document.getElementById('f_categoria').value = novoTx.cat;
   document.getElementById('f_tipo').value = novoTx.type;
   document.getElementById('f_valor').value = novoTx.amount;
   document.getElementById('f_pagamento').value = novoTx.pay;

   enviando = true;
   document.getElementById('hidden_form').submit();
 }

 render();
 document.getElementById('syncStatus').textContent='● sincronizado';
}

async function delTx(id){
 if(!confirm('Excluir este lançamento?')) return;
 state.tx = state.tx.filter(t => t.id !== id);
 render();
 document.getElementById('syncStatus').textContent='● excluindo...';

 document.getElementById('f_action').value = 'delete';
 document.getElementById('f_id').value = id;
 document.getElementById('f_data').value = '';
 document.getElementById('f_descricao').value = '';
 document.getElementById('f_categoria').value = '';
 document.getElementById('f_tipo').value = '';
 document.getElementById('f_valor').value = '';
 document.getElementById('f_pagamento').value = '';

 enviando = true;
 document.getElementById('hidden_form').submit();
 render();
}

async function carregarDadosDaPlanilha(){
 document.getElementById('syncStatus').textContent='● carregando...';
 try {
   const res = await fetch(SCRIPT_URL);
   const rows = await res.json();
   if(Array.isArray(rows)){
     state.tx = rows.map(r => ({
       id: String(r.id || ''),
       date: String(r.data || '').slice(0,10),
       desc: String(r.descricao || ''),
       cat: String(r.categoria || 'Outros'),
       icon: (state.categories.find(c=>c[1]===r.categoria)||['💸'])[0],
       amount: Number(r.valor || 0),
       type: String(r.tipo || 'expense'),
       pay: String(r.pagamento || '')
     })).filter(t => t.id);
     render();
     document.getElementById('syncStatus').textContent='● conectado à planilha';
   }
 } catch(e) {
   console.error('Erro ao carregar dados:', e);
   document.getElementById('syncStatus').textContent='● erro ao sincronizar';
 }
}

function fmtDate(s){if(!s)return'';return new Date(s+'T12:00:00').toLocaleDateString('pt-BR')}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

document.addEventListener('DOMContentLoaded', async ()=>{
  await carregarDadosDaPlanilha();
});
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body>
</html>
